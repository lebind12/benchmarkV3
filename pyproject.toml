[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-backend"
version = "0.0.0"
description = "축구 정보 사이트 백엔드 (방송용 페이지 포함). FastAPI + SQLAlchemy + Supabase + 프리뷰."
requires-python = ">=3.11"
readme = "README.md"
# 원래 benchmark 앱과 프리뷰 기능이 한 앱이 됐다. 같은 목록을 requirements.txt에도
# 고정한다. 두 목록이 어긋나면 어느 쪽이 기준인지 알 수 없게 되므로 함께 고친다.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "SQLAlchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "argon2-cffi==23.1.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.7.0",
    # 원래 benchmark 앱 요구사항
    "PyJWT>=2.10,<3",
    "jsonschema>=4.23",
    "apscheduler>=3.10",
    "requests>=2.32",
    "openai>=1.0",
    "google-auth>=2.0",
    # 프리뷰 실행 구조
    "langgraph==1.2.20",
    "langgraph-checkpoint==4.3.1",
    "google-genai==3.0.0",
    "trafilatura==2.3.1",
    "lxml==6.1.3",
    "lxml_html_clean==0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "frontend*", "scripts*", "seeds*", "docs*", "out*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires real provider credentials and explicit opt-in",
    "unit: fast in-process tests (no external services)",
    "integration: tests touching DB / Upstash / external APIs",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
