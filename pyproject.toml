[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "match-preview"
version = "0.1.0"
description = "Football match preview research app"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires real provider credentials and explicit opt-in",
]
addopts = "-m 'not live'"
