# Legacy harness-runner configuration; not the Codex agent settings loader.
# Active execution: scripts/harness-run.sh (this file is not loaded by it).
# Active Codex settings: .codex/config.toml; policy: docs/spec/agentic-workflow.md.
# Worktree isolation follows AGENTS.md. Only the operator decides merges.

[project]
name = "benchmark"
version = "0.1.0"
description = "Operator-led planning, development, independent testing and service portfolio"

[agent]
# default = "security-reviewer"

[env]
# HARNESS_STATE_ROOT = ".codex/state"

[safety.permissions]
deny = [
  "Bash(sudo:*)",
]
ask = [
  "Bash(rm -r:*)",
  "Bash(git push --force:*)",
  "Bash(koyeb deploy:*)",
  "Bash(koyeb services update:*)",
  "Bash(koyeb service update:*)",
  "Bash(koyeb services redeploy:*)",
  "Bash(koyeb service redeploy:*)",
  "Bash(vercel deploy:*)",
  "Bash(vercel env add:*)",
  "Bash(vercel env rm:*)",
  "Bash(vercel env remove:*)",
]

[safety.sandbox]
failIfUnavailable = false

[safety.sandbox.filesystem]
# denyRead = [".env", "secrets/**"]
# allowRead = [".env.example"]
