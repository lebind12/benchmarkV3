# Harness v4 Configuration
# Codex workflow uses .codex/agents, .codex/schemas, and .codex/state.
# Git workflow uses one checkout with task branches; project agents must not create worktrees.

[project]
name = "benchmark"
version = "0.1.0"
description = ""

[agent]
# default = "security-reviewer"

[env]
# HARNESS_STATE_ROOT = ".codex/state"

[safety.permissions]
deny = [
  "Bash(sudo:*)",
]
ask = [
  "Bash(rm -r:*)",
  "Bash(git push --force:*)",
  "Bash(koyeb deploy:*)",
  "Bash(koyeb services update:*)",
  "Bash(koyeb service update:*)",
  "Bash(koyeb services redeploy:*)",
  "Bash(koyeb service redeploy:*)",
  "Bash(vercel deploy:*)",
  "Bash(vercel env add:*)",
  "Bash(vercel env rm:*)",
  "Bash(vercel env remove:*)",
]

[safety.sandbox]
failIfUnavailable = false

[safety.sandbox.filesystem]
# denyRead = [".env", "secrets/**"]
# allowRead = [".env.example"]
